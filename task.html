body.light .hkg{opacity:.92}

/* header */
.hd{padding:22px 52px 0 0}
.hi{font-size:24px;font-weight:750;letter-spacing:-.6px;margin-top:16px}
.hs{font-size:13px;color:var(--d);margin-top:6px;line-height:1.5}
.hs b{color:var(--red2);font-weight:700}
.th{position:absolute;top:20px;right:18px;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--b);background:var(--c);color:var(--d);font-size:14px;cursor:pointer}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 4px}
.ct{background:var(--c);border:1px solid var(--b);border-radius:13px;padding:14px 8px;text-align:center}
.ct.hot{border-color:rgba(204,0,0,.45)}
.ct-v{font-size:25px;font-weight:750;letter-spacing:-1px;line-height:1}
.ct-l{font-size:9.5px;color:var(--d);letter-spacing:1.2px;text-transform:uppercase;margin-top:7px}
.tabs{display:flex;gap:8px;margin:24px 0 4px;overflow-x:auto;padding-bottom:2px}
.tb{flex:1;min-width:96px;min-height:46px;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:8px;border-radius:11px;font-size:12.5px;
  font-weight:700;letter-spacing:.4px;cursor:pointer;background:var(--c);border:1px solid var(--b);
  color:var(--d);white-space:nowrap;transition:all .15s}
.tb.on{background:var(--red);border-color:var(--red);color:#fff}
.tb i{font-style:normal;opacity:.75;font-weight:600;margin-left:5px}
.slip{display:inline-flex;align-items:center;gap:6px;background:var(--c2);border:1px solid var(--b);
  border-radius:8px;padding:7px 11px;font-size:11px;color:var(--d);margin-top:13px;letter-spacing:.2px}
.slip b{color:var(--t2);font-weight:600}
.wait{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--amb);background:rgba(232,160,0,.12);border:1px solid rgba(232,160,0,.35);
  padding:5px 10px;border-radius:20px;margin-top:13px}
.okd{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--grn);background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.35);
  padding:5px 10px;border-radius:20px;margin-top:13px}
.k.quiet{opacity:.9}
.pg{height:4px;background:var(--trk);border-radius:2px;margin:18px 0 4px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--grn);border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.pgl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--d);letter-spacing:.3px}

/* section label */
h2{font-size:10.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--d);margin:34px 0 12px}
h2.hot{color:var(--red2)}
.list{display:grid;gap:12px;grid-template-columns:1fr}
.list>*{min-width:0}
@media(min-width:640px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:1200px){.list{grid-template-columns:1fr 1fr 1fr}}

/* card */
.k{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;min-width:0;overflow-wrap:anywhere;
  transition:opacity .3s,transform .3s}
.k.hot{border-color:rgba(204,0,0,.45)}
.k.out{opacity:0;transform:scale(.97)}
.kh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kt{font-size:16.5px;font-weight:650;line-height:1.32;letter-spacing:-.3px;flex:1;min-width:0}
.kd{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  white-space:nowrap;color:var(--d);padding-top:3px}
.kd.hot{color:var(--red2)}
.kd.warm{color:var(--amb)}
.km{font-size:10.5px;color:var(--d);letter-spacing:.5px;text-transform:uppercase;margin-top:6px}
.kn{font-size:13px;color:var(--t2);line-height:1.5;margin-top:11px;padding:11px 12px;
  background:var(--c2);border-radius:10px}

/* the "left to go" headline */
.left{margin:16px 0 0}
.left-v{font-size:34px;font-weight:750;letter-spacing:-1.5px;line-height:1;color:var(--t)}
.left-v em{font-style:normal;font-size:18px;font-weight:650;color:var(--t2);letter-spacing:-.4px}
.left-l{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--d);margin-top:9px;letter-spacing:.2px}
.bar{height:7px;background:var(--trk);border-radius:4px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:var(--red2);border-radius:4px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar i.ok{background:var(--grn)}

/* quick add */
.quick{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.q{flex:1;min-width:58px;min-height:46px;display:flex;align-items:center;justify-content:center;padding:0 4px;border-radius:10px;background:var(--c2);border:1px solid var(--b);
  color:var(--t2);font-size:13px;font-weight:650;text-align:center;cursor:pointer;transition:transform .1s}
.q:active{transform:scale(.94)}
.entry{display:flex;gap:9px;margin-top:9px}
input,textarea{flex:1;min-width:0;background:var(--c2);border:1px solid var(--b);color:var(--t);
  padding:15px;border-radius:12px;font-size:17px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--red)}
input::placeholder,textarea::placeholder{color:var(--d)}
textarea{resize:none;line-height:1.5;font-size:16px}
.go{border:none;border-radius:12px;background:var(--red);color:#fff;font-family:inherit;
  font-size:13px;font-weight:750;letter-spacing:1px;text-transform:uppercase;padding:0 24px;
  cursor:pointer;transition:transform .1s}
.go:active{transform:scale(.95)}
.big{width:100%;padding:17px;margin-top:16px;border-radius:12px;border:none;font-family:inherit;
  font-size:14px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:#fff;
  background:var(--grn);cursor:pointer;transition:transform .1s}
.big:active{transform:scale(.98)}
.big.r{background:var(--red)}
.log{font-size:11px;color:var(--d);margin-top:12px;line-height:1.7}
.undo{color:var(--red2);cursor:pointer;white-space:nowrap;border-bottom:1px solid rgba(204,0,0,.4);margin-left:4px}
.kwhen{text-align:right;flex-shrink:0}
.kdate{font-size:14px;color:var(--t);font-weight:700;letter-spacing:-.3px;margin-top:5px;white-space:nowrap}
.kdate.hot{color:var(--red2)}
.ct{cursor:pointer;transition:border-color .15s,background .15s}
.ct.sel{border-color:var(--red);background:rgba(204,0,0,.07)}
.filtbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 -8px;
  font-size:11.5px;color:var(--d);letter-spacing:.3px}
.filtbar span{color:var(--red2);cursor:pointer;font-weight:650}

/* done strip */
.dn{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--b)}
.dn .ck{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:rgba(0,200,83,.14);
  border:1px solid rgba(0,200,83,.4);color:var(--grn);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.dn .dt{flex:1;font-size:14px;font-weight:600}
.dn .ds{display:block;font-size:10.5px;color:var(--d);font-weight:400;margin-top:3px}
.dn .dv{font-size:13px;color:var(--grn);font-weight:650;white-space:nowrap}
.clear{text-align:center;padding:44px 20px;color:var(--d);font-size:14px;line-height:1.7}
.clear b{display:block;font-size:19px;color:var(--grn);font-weight:700;margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);z-index:99;
  background:var(--grn);color:#fff;font-size:13px;font-weight:650;padding:14px 22px;border-radius:12px;
  transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90vw}
.toast.up{transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.flag{background:var(--amb);color:#000;font-size:9px;letter-spacing:1.6px;font-weight:800;

<body class="dark">
<div id="pw-screen">
  <div><span class="hkg-mark pw" aria-label="HKG"></span></div>
  <div class="pw-title">Your tasks and targets</div>

  <div class="pw-field">
    <label class="pw-lab" for="pw-user">Username</label>
    <input class="pw-input" type="text" id="pw-user" autocapitalize="none" autocorrect="off"
           spellcheck="false" placeholder="e.g. atiquehkg" onkeydown="if(event.key==='Enter')focusPin()">
  </div>

  <div class="pw-field">
    <label class="pw-lab" for="pw-pin">4-digit PIN</label>
    <input class="pw-input" type="password" id="pw-pin" inputmode="numeric" maxlength="8"
           placeholder="&#8226;&#8226;&#8226;&#8226;" onkeydown="if(event.key==='Enter')doLogin()">
  </div>

  <button class="pw-btn" id="pw-btn" onclick="doLogin()">Sign in</button>
  <div class="pw-err" id="pw-err"></div>
  <div class="pw-help">Your username and PIN come from the office.<br>Forgot your PIN? Ask them to reset it.</div>
</div>
<button class="th" id="th" onclick="flip()">☀</button>
<div class="out-btn" id="outbtn" onclick="signOut()" style="display:none">Sign out</div>

    <div class="hkg"></div>
    <div class="hi" id="hi"></div>
    <div class="hs" id="hs"></div>
    <div class="counts" id="counts"></div>
  </div>
  <div class="tabs" id="tabs"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL='https://bwfbiusxzfalzrphbkkg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3ZmJpdXN4emZhbHpycGhia2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjUxNzMsImV4cCI6MjEwMTEwMTE3M30.ux5xrhevgoM-wO7Oys7QK5461zP9-LuoTatvnXjSFNg';
var sb=null; try{sb=supabase.createClient(SB_URL,SB_KEY);}catch(e){}

var ME=null, TAB=0, FILT='all', T=[], MYSUBS=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nm(x){var v=Number(x)||0;return v%1===0?String(v):v.toFixed(1);}
function E(i){return document.getElementById(i);}
function pad(p){return 'hkg-'+p;}
function dy(d){if(!d)return 9999;var t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(d+'T00:00:00')-t)/86400000);}
function when(d){if(!d)return{t:'No date',c:''};var k=dy(d);
  return k<0?{t:k===-1?'1 day late':(-k)+' days late',c:'hot'}:k===0?{t:'Today',c:'hot'}:
    k===1?{t:'Tomorrow',c:'warm'}:k<=3?{t:'In '+k+' days',c:'warm'}:{t:'In '+k+' days',c:''};}
function dateShort(d){
  if(!d)return 'No deadline';
  var x=new Date(d+'T00:00:00');
  return 'Due: '+x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
}
function dateLine(d){
  if(!d)return 'No deadline';
  var x=new Date(d+'T00:00:00'), k=dy(d);
  return (k<0?'Was due ':'Due ')+x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long'});
}
function stamp(d){if(!d)return '';d=new Date(d);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' at '+
         d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'});}

/* ---- derived values straight from my_tasks() ---- */
function got(t){return Number(t.scope==='shared'?t.team_total:t.my_total)||0;}
function mineTotal(t){return Number(t.my_total)||0;}
function rest(t){return Math.max(0,(Number(t.target)||0)-got(t));}
function subsFor(id){return MYSUBS.filter(function(s){return s.task_id===id;});}
function isNum(t){return t.kind==='number';}
function pending(){return T.filter(function(t){return t.state==='pending';});}
function completed(){return T.filter(function(t){return t.state==='completed';})
  .sort(function(a,b){return new Date(b.finished_at||0)-new Date(a.finished_at||0);});}
function approved(){return T.filter(function(t){return t.state==='approved';})
  .sort(function(a,b){return new Date(b.approved_at||0)-new Date(a.approved_at||0);});}
function urgent(){return pending().filter(function(t){return t.deadline&&dy(t.deadline)<=0;});}
function ord(a,b){return dy(a.deadline)-dy(b.deadline);}
function steps(t){
  var r=rest(t);if(r<=0)return[];
  var base=Math.pow(10,Math.floor(Math.log(r)/Math.LN10));
  var s=[base/2,base,base*2].map(function(x){return Math.round(x*10)/10;})
    .filter(function(x){return x>0&&x<=r;});
  s=s.filter(function(v,i){return s.indexOf(v)===i;});
  if(s.indexOf(r)<0)s.push(r);
  return s.slice(-3);
}

/* ---------- auth ---------- */
function lockView(err){
  var s=E('pw-screen'); if(s)s.classList.remove('gone');
  var e=E('pw-err'); if(e)e.textContent=err||'';
  var b=E('pw-btn'); if(b){b.disabled=false;b.textContent='Sign in';}
  var p=E('pw-pin'); if(p)p.value='';
  E('outbtn').style.display='none';
  E('out').innerHTML='';E('counts').innerHTML='';E('tabs').innerHTML='';
  E('hi').textContent='';E('hs').textContent='';
}
function unlock(){var s=E('pw-screen');if(s)s.classList.add('gone');E('outbtn').style.display='block';}
async function doLogin(){
  var u=(E('pw-user').value||'').trim().toLowerCase(), p=(E('pw-pin').value||'').trim();
  if(!u){lockView('Type your username');return;}
  if(!p){lockView('Type your 4-digit PIN');return;}
  if(!sb){lockView('Cannot reach the server. Check your internet and reload.');return;}
  var b=E('pw-btn'); b.disabled=true; b.textContent='Signing in\u2026';
  var r;
  try{ r=await sb.auth.signInWithPassword({email:u+'@hkg.local',password:pad(p)}); }
  catch(e){ lockView('Cannot reach the server. Check your internet and reload.'); return; }
  if(r.error){lockView('That username and PIN do not match. Try again.');return;}
  unlock();
  boot(r.data && r.data.user ? r.data.user.id : null);
}
async function signOut(){ if(sb)await sb.auth.signOut(); ME=null; lockView(); }

async function boot(uid){
  E('out').innerHTML='<div class="spin">Loading\u2026</div>';
  if(!uid){
    var s=await sb.auth.getSession();
    if(!s.data.session){lockView();return;}
    uid=s.data.session.user.id;
  }
  unlock();
  var pr=await sb.from('profiles').select('id,name,active').eq('id',uid).maybeSingle();
  if(pr.error||!pr.data){lockView('Account not set up. Ask the office.');return;}
  if(pr.data.active===false){await sb.auth.signOut();lockView('This account is inactive');return;}
  ME=pr.data;
  await refresh();
}
async function refresh(){
  var r=await sb.rpc('my_tasks');
  if(r.error){
    E('out').innerHTML='<div class="clear"><b>Could not load</b>'+esc(r.error.message)+'</div>';
    return;
  }
  T=r.data||[];
  var s=await sb.from('submissions').select('*').eq('person_id',ME.id).order('created_at',{ascending:true});
  MYSUBS=s.data||[];
  render();
}

/* ---------- render ---------- */
function render(){
  var first=(ME.name||'').split(/\s+/)[0];
  E('hi').textContent='Hello, '+first;
  var p=pending(),u=urgent();
  E('hs').innerHTML=u.length?'<b>'+u.length+' need'+(u.length===1?'s':'')+' you today</b>'
    :p.length?p.length+' open, nothing urgent':'Nothing outstanding';
  var tk=p.filter(function(t){return !isNum(t);}).length, tg=p.filter(isNum).length;
  E('counts').innerHTML=tile(u.length,'Urgent',u.length?'hot':'','urgent')+
    tile(tk,'Tasks','','task')+tile(tg,'Targets','','target');
  E('tabs').innerHTML=[['Pending',p.length],['Completed',completed().length],['Approved',approved().length]]
    .map(function(x,i){return '<div class="tb'+(i===TAB?' on':'')+'" onclick="TAB='+i+';render()">'+x[0]+
      (x[1]?'<i>'+x[1]+'</i>':'')+'</div>';}).join('');
  E('out').innerHTML = TAB===0?viewPending() : TAB===1?viewCompleted() : viewApproved();
  window.scrollTo({top:0,behavior:'instant'});
}
function tile(n,l,c,f){
  var on=FILT===f;
  return '<div class="ct '+c+(on?' sel':'')+'" onclick="setFilt(\''+f+'\')"><div class="ct-v"'+
    (c==='hot'&&n?' style="color:var(--red2)"':'')+'>'+n+'</div><div class="ct-l">'+l+'</div></div>';
}
function setFilt(f){FILT=(FILT===f?'all':f);TAB=0;render();}
function passFilt(t){
  if(FILT==='all')return true;
  if(FILT==='task')return !isNum(t);
  if(FILT==='target')return isNum(t);
  if(FILT==='urgent')return t.deadline&&dy(t.deadline)<=0;
  return true;
}
function viewPending(){
  var o=pending().filter(passFilt);
  var lbl={all:'',urgent:'urgent only',task:'tasks only',target:'targets only'}[FILT];
  var banner=FILT==='all'?'':'<div class="filtbar">Showing '+lbl+
    '<span onclick="setFilt(\'all\')">Show all</span></div>';
  if(!o.length)return banner+'<div class="clear"><b>Nothing here</b>'+
    (FILT==='all'?'Nothing needs you right now.':'No '+lbl.replace(' only','')+' pending.')+'</div>';
  var h=banner;
  h+=grp('Do these first',o.filter(function(t){return t.deadline&&dy(t.deadline)<0;}).sort(ord),1);
  h+=grp('Today and tomorrow',o.filter(function(t){var k=dy(t.deadline);return t.deadline&&k>=0&&k<=1;}).sort(ord));
  h+=grp('This week',o.filter(function(t){var k=dy(t.deadline);return t.deadline&&k>1&&k<=7;}).sort(ord));
  h+=grp('Later',o.filter(function(t){return !t.deadline||dy(t.deadline)>7;}).sort(ord));
  return h;
}
function viewCompleted(){
  var l=completed();
  if(!l.length)return '<div class="clear"><b>Nothing waiting</b>Work you finish appears here until it is approved.</div>';
  return '<h2>Waiting for approval</h2><div class="list">'+l.map(function(t){return doneCard(t,false);}).join('')+'</div>';
}
function viewApproved(){
  var l=approved();
  if(!l.length)return '<div class="clear"><b>Nothing yet</b>Approved work will be kept here.</div>';
  return '<h2>Signed off</h2><div class="list">'+l.map(function(t){return doneCard(t,true);}).join('')+'</div>';
}
function grp(name,list,hot){
  if(!list.length)return '';
  return '<h2'+(hot?' class="hot"':'')+'>'+esc(name)+'</h2><div class="list">'+list.map(card).join('')+'</div>';
}
function result(t){
  if(isNum(t))return nm(got(t))+' '+esc(t.unit||'');
  if(t.kind==='check')return 'Marked done';
  var s=subsFor(t.id).filter(function(x){return x.note;});
  return s.length?esc(s[s.length-1].note):'Answered';
}
function doneCard(t,ok){
  var h='<div class="k quiet"><div class="kh"><div class="kt">'+esc(t.title)+'</div></div>'+
    '<div class="km">'+esc(t.team_name||'')+' \u00b7 '+(isNum(t)?'Target':t.kind==='check'?'Yes / No':'Written')+'</div>'+
    '<div class="left" style="margin-top:12px"><div class="left-v" style="font-size:24px">'+result(t)+'</div></div>'+
    '<div class="slip">\u2713 <b>Completed</b> '+stamp(t.finished_at)+'</div>';
  h+= ok ? '<div><span class="okd">Approved '+stamp(t.approved_at)+'</span></div>'
         : '<div><span class="wait">Waiting for approval</span></div>';
  return h+'</div>';
}
function card(t){
  var w=when(t.deadline);
  var h='<div class="k'+(w.c==='hot'?' hot':'')+'" id="k'+t.id+'">'+
    '<div class="kh"><div class="kt">'+esc(t.title)+'</div>'+
      '<div class="kwhen"><div class="kd '+w.c+'">'+w.t+'</div>'+
      '<div class="kdate'+(w.c==='hot'?' hot':'')+'">'+esc(dateShort(t.deadline))+'</div></div></div>'+
    '<div class="km">'+esc(t.team_name||'')+(t.scope==='shared'?' \u00b7 shared target':'')+'</div>';
  if(t.note)h+='<div class="kn">'+esc(t.note)+'</div>';
  if(isNum(t)){
    var r=rest(t),pc=t.target?Math.min(100,Math.round(got(t)/t.target*100)):0;
    h+='<div class="left"><div class="left-v">'+nm(got(t))+'<em>&nbsp;of '+nm(t.target)+' '+esc(t.unit||'')+'</em></div>'+
       '<div class="bar"><i class="'+(pc>=100?'ok':'')+'" style="width:'+pc+'%"></i></div>'+
       '<div class="left-l"><span>'+nm(r)+' '+esc(t.unit||'')+' still to go</span>'+
       '<span>'+pc+'%'+(t.scope==='shared'?' \u00b7 team total':'')+'</span></div></div>';
    var st=steps(t);
    if(st.length)h+='<div class="quick">'+st.map(function(v){
      return '<div class="q" onclick="quick(\''+t.id+'\','+v+')">+'+nm(v)+'</div>';}).join('')+'</div>';
    h+='<div class="entry"><input id="i'+t.id+'" inputmode="decimal" placeholder="Other amount (\u2212 to correct)" '+
       'onkeydown="if(event.key===\'Enter\')add(\''+t.id+'\')"><button class="go" onclick="add(\''+t.id+'\')">Add</button></div>';
    h+=logLine(t);
  }else if(t.kind==='check'){
    h+='<button class="big" onclick="mark(\''+t.id+'\')">Mark done</button>';
  }else{
    h+='<textarea id="i'+t.id+'" rows="3" placeholder="Type your answer here" style="margin-top:16px;width:100%"></textarea>'+
       '<button class="big r" onclick="send(\''+t.id+'\')">Send answer</button>';
  }
  return h+'</div>';
}

/* ---------- writes ---------- */
var BUSY=false;
async function post(id,row,msg){
  if(BUSY)return; BUSY=true;
  var r=await sb.from('submissions').insert(Object.assign({task_id:id,person_id:ME.id},row));
  BUSY=false;
  if(r.error){say('Could not save \u2014 '+r.error.message);return false;}
  say(msg); await refresh(); return true;
}
function logLine(t){
  var my=subsFor(t.id).filter(function(x){return x.value!=null;});
  if(!my.length)return '';
  var parts=my.map(function(x){return (Number(x.value)<0?'\u2212':'+')+nm(Math.abs(x.value));}).join(' ');
  var last=my[my.length-1];
  var h='<div class="log">You have logged '+parts+' = '+nm(mineTotal(t))+' '+esc(t.unit||'');
  if(last&&Number(last.value)>0)
    h+=' <span class="undo" onclick="undo(\''+t.id+'\','+last.value+')">Remove last (\u2212'+nm(last.value)+')</span>';
  return h+'</div>';
}
function undo(id,amt){
  var t=T.filter(function(x){return x.id===id;})[0];
  if(!t)return;
  if(mineTotal(t)-amt<0){say('That would take you below zero');return;}
  if(!confirm('Remove the last entry of '+nm(amt)+' '+(t.unit||'')+'?\n\nThis logs a correction; the original stays on record.'))return;
  post(id,{value:-amt},'Removed '+nm(amt)+' '+(t.unit||''));
}
function quick(id,v){post(id,{value:v},'Added '+nm(v)+' '+(T.filter(function(x){return x.id===id;})[0]||{}).unit);}
function add(id){
  var t=T.filter(function(x){return x.id===id;})[0];
  var i=E('i'+id),raw=(i.value||'').trim(),v=Number(raw);
  if(!raw||isNaN(v)||v===0){i.style.borderColor='var(--red2)';say('Type an amount first');return;}
  if(v<0&&t&&mineTotal(t)+v<0){say('That would take you below zero');return;}
  i.value='';
  post(id,{value:v},(v<0?'Removed ':'Added ')+nm(Math.abs(v))+' '+((t&&t.unit)||''));
}
function mark(id){post(id,{done:true},'Sent for approval');}
function send(id){
  var i=E('i'+id),v=(i.value||'').trim();
  if(!v){i.style.borderColor='var(--red2)';say('Write your answer first');return;}
  post(id,{note:v},'Answer sent for approval');
}
var mt;function say(m){var e=E('tst');e.textContent=m;e.classList.add('up');
  clearTimeout(mt);mt=setTimeout(function(){e.classList.remove('up');},2400);}
function flip(){var b=document.body,d=b.classList.contains('dark');
  b.classList.toggle('dark',!d);b.classList.toggle('light',d);E('th').textContent=d?'\u263e':'\u2600';}

function focusPin(){var p=E('pw-pin');if(p)p.focus();}
if(!sb)lockView();
else sb.auth.getSession().then(function(s){ s.data.session?boot():lockView(); });

</script>
