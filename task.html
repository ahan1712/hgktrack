<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HKG Tasks">
<meta name="theme-color" content="#000000">
<title>HKG Tasks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif}
body{background:#000;color:#fff;--bg:#000;--s1:#0a0a0a;--s2:#0f0f0f;--b1:#1a1a1a;--b2:#222;--red:#cc0000;--red2:#e8000a;--dim:#555;--txt2:#c8c8d0;--txt3:#888;--green:#00c853;--amber:#e8a000}
.wrap{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hd{padding:18px 16px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#000;z-index:10}
.hd-t{font-size:15px;font-weight:700;letter-spacing:1.5px}
.hd-s{font-size:10px;color:var(--txt3);letter-spacing:.5px;margin-top:2px}
.lo{font-size:10px;color:var(--dim);border:1px solid var(--b2);padding:6px 10px;border-radius:6px;cursor:pointer;letter-spacing:.5px}
.bd{flex:1;padding:14px 16px 40px}
.inp{width:100%;background:var(--s2);border:1px solid var(--b2);color:#fff;padding:14px;border-radius:8px;font-size:16px;font-family:inherit;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--red)}
.btn{width:100%;background:var(--red);color:#fff;border:none;padding:15px;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}
.btn2{background:var(--s2);border:1px solid var(--b2);color:var(--txt2)}
.lbl{font-size:10px;color:var(--txt3);letter-spacing:1px;font-weight:600;margin-bottom:7px;text-transform:uppercase}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.card.done{opacity:.5}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.c-ttl{font-size:14px;font-weight:600;line-height:1.35;flex:1}
.pill{font-size:9px;font-weight:700;letter-spacing:.5px;padding:4px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.p-over{background:rgba(204,0,0,.15);color:#ff4444;border:1px solid rgba(204,0,0,.4)}
.p-soon{background:rgba(232,160,0,.12);color:var(--amber);border:1px solid rgba(232,160,0,.35)}
.p-ok{background:var(--s2);color:var(--txt3);border:1px solid var(--b2)}
.p-done{background:rgba(0,200,83,.12);color:var(--green);border:1px solid rgba(0,200,83,.35)}
.c-meta{font-size:10.5px;color:var(--txt3);letter-spacing:.3px}
.bar{height:5px;background:var(--b1);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--red2);border-radius:3px;transition:width .4s}
.bar i.full{background:var(--green)}
.prog{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-top:6px;letter-spacing:.3px}
.sec{font-size:10px;color:var(--dim);letter-spacing:1.5px;font-weight:700;margin:22px 0 10px;text-transform:uppercase}
.sec:first-child{margin-top:4px}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:50px 20px;line-height:1.6}
.msg{font-size:11.5px;padding:11px;border-radius:7px;margin-bottom:10px;line-height:1.45}
.m-err{background:rgba(204,0,0,.12);color:#ff5555;border:1px solid rgba(204,0,0,.3)}
.m-ok{background:rgba(0,200,83,.1);color:var(--green);border:1px solid rgba(0,200,83,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-in{background:#0d0d0d;border-top:1px solid var(--b2);border-radius:16px 16px 0 0;width:100%;max-width:430px;margin:0 auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.grab{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 16px}
.hist{border-left:2px solid var(--b1);padding:9px 0 9px 12px;margin-bottom:4px}
.hist b{font-size:13px;font-weight:600}
.hist span{font-size:10px;color:var(--txt3);display:block;margin-top:2px}
.tog{display:flex;gap:8px;margin-bottom:12px}
.tog div{flex:1;text-align:center;padding:13px;border-radius:8px;border:1px solid var(--b2);background:var(--s2);font-size:12px;font-weight:600;cursor:pointer;color:var(--txt3)}
.tog div.on{background:var(--red);border-color:var(--red);color:#fff}
.spin{text-align:center;padding:50px;color:var(--dim);font-size:12px;letter-spacing:1px}

.hkg-mark.pw{width:160px;height:58px;margin-bottom:4px}
#pw-screen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#pw-screen.gone{display:none}
.pw-logo{font-size:48px;font-weight:900;letter-spacing:8px;color:#fff}
.pw-input{background:#111;border:1px solid #333;color:#fff;font-size:16px;padding:12px 20px;border-radius:6px;width:200px;text-align:center;font-family:inherit;letter-spacing:2px;outline:none}
.pw-input:focus{border-color:#cc0000}

.pw-btn:active{opacity:.8}
.pw-btn:disabled{opacity:.5}
.pw-err{font-size:11px;color:#cc0000;letter-spacing:1px;text-transform:uppercase;height:16px;text-align:center;line-height:1.5}

<body>
<div id="pw-screen">
  <div class="pw-logo"><span class="hkg-mark pw" aria-label="HKG"></span></div>
  <div style="font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-top:-10px">Factory Operations</div>
  <input class="pw-input" type="text" id="pw-user" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')doLogin()">
  <input class="pw-input" type="password" id="pw-pin" inputmode="numeric" maxlength="8" placeholder="&#8226;&#8226;&#8226;&#8226;" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="pw-btn" id="pw-btn" onclick="doLogin()">Enter</button>
  <div class="pw-err" id="pw-err"></div>
</div>

<div class="wrap">
  <div class="hd">
    <div>
      <div class="hd-t">HKG TASKS</div>
      <div class="hd-s" id="who">—</div>
    </div>
    <div class="lo" id="lo" onclick="logout()" style="display:none">SIGN OUT</div>
  </div>
  <div class="bd" id="bd"><div class="spin">LOADING…</div></div>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-in" id="sheet-in"></div>
</div>

<script>
var SB_URL='https://bwfbiusxzfalzrphbkkg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3ZmJpdXN4emZhbHpycGhia2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjUxNzMsImV4cCI6MjEwMTEwMTE3M30.ux5xrhevgoM-wO7Oys7QK5461zP9-LuoTatvnXjSFNg';
var sb=null;try{sb=supabase.createClient(SB_URL,SB_KEY);}catch(e){}
var ME=null, TASKS=[], SUBS=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(id){return document.getElementById(id);}
function pad(p){return 'hkg-'+p;}
function num(n){var x=Number(n)||0;return x%1===0?String(x):x.toFixed(1);}

function daysTo(d){
  if(!d)return null;
  var t=new Date();t.setHours(0,0,0,0);
  var x=new Date(d+'T00:00:00');
  return Math.round((x-t)/86400000);
}
function dueLabel(d){
  var n=daysTo(d);
  if(n===null)return {t:'NO DATE',c:'p-ok'};
  if(n<0)return {t:(-n)+'D OVERDUE',c:'p-over'};
  if(n===0)return {t:'TODAY',c:'p-soon'};
  if(n===1)return {t:'TOMORROW',c:'p-soon'};
  if(n<=3)return {t:n+' DAYS',c:'p-soon'};
  return {t:n+' DAYS',c:'p-ok'};
}

/* ---------- login ---------- */
function loginView(err){
  var s=el('pw-screen'); if(s)s.classList.remove('gone');
  var e=el('pw-err'); if(e)e.textContent=err||'';
  var b=el('pw-btn'); if(b){b.disabled=false;b.textContent='Enter';}
  var p=el('pw-pin'); if(p)p.value='';
  el('lo').style.display='none';
  el('who').textContent='';
  el('bd').innerHTML='';
  var u=el('pw-user'); if(u&&!err)u.focus();
}
function loginOpen(){var s=el('pw-screen');if(s)s.classList.add('gone');}

async function doLogin(){
  var u=(el('pw-user').value||'').trim().toLowerCase(), p=(el('pw-pin').value||'').trim();
  if(!u||!p){loginView('Enter username and PIN');return;}
  if(!sb){loginView('No connection — check internet');return;}
  var b=el('pw-btn'); if(b){b.disabled=true;b.textContent='Checking…';}
  var r;
  try{ r=await sb.auth.signInWithPassword({email:u+'@hkg.local',password:pad(p)}); }
  catch(e){ loginView('No connection — check internet'); return; }
  if(r.error){loginView('Wrong username or PIN');return;}
  loginOpen();
  boot();
}
async function logout(){await sb.auth.signOut();ME=null;loginView();}

/* ---------- load ---------- */
async function boot(){
  el('bd').innerHTML='<div class="spin">LOADING…</div>';
  var s=await sb.auth.getSession();
  if(!s.data.session){loginView();return;}
  loginOpen();
  var uid=s.data.session.user.id;
  var pr=await sb.from('profiles').select('id,name,active').eq('id',uid).maybeSingle();
  if(pr.error||!pr.data){loginView('Account not set up. Contact the office.');return;}
  if(pr.data.active===false){await sb.auth.signOut();loginView('This account is inactive.');return;}
  ME=pr.data;
  var mb=await sb.from('memberships').select('teams(name)').eq('person_id',uid);
  var tn=(mb.data||[]).map(function(r){return r.teams&&r.teams.name;}).filter(Boolean);
  tn=tn.filter(function(v,i){return tn.indexOf(v)===i;});
  el('who').textContent=(ME.name||'').toUpperCase()+(tn.length?' · '+tn.join(', ').toUpperCase():'');
  el('lo').style.display='block';
  await refresh();
}

async function refresh(){
  var t=await sb.rpc('my_open_tasks');
  if(t.error){el('bd').innerHTML='<div class="empty">Could not load tasks.<br>'+esc(t.error.message)+'</div>';return;}
  TASKS=(t.data||[]);
  var s=await sb.from('submissions').select('*').eq('person_id',ME.id).order('created_at',{ascending:false});
  SUBS=(s.data||[]);
  render();
}

function mine(tid){return SUBS.filter(function(x){return x.task_id===tid;});}
function total(tid){
  return mine(tid).reduce(function(a,b){return a+(Number(b.value)||0);},0);
}
function isDone(t){return false;}
function shown(t){return t.scope==='shared'?(Number(t.team_total)||0):(Number(t.my_total)||0);}

function render(){
  if(!TASKS.length){
    el('bd').innerHTML='<div class="empty">No open tasks right now.<br>You are all clear.</div>';
    return;
  }
  var g={over:[],today:[],week:[],later:[],done:[]};
  TASKS.forEach(function(t){
    if(isDone(t)){g.done.push(t);return;}
    var n=daysTo(t.deadline);
    if(n===null)g.later.push(t);
    else if(n<0)g.over.push(t);
    else if(n===0)g.today.push(t);
    else if(n<=7)g.week.push(t);
    else g.later.push(t);
  });
  var h='';
  function sec(title,arr){
    if(!arr.length)return '';
    return '<div class="sec">'+title+' · '+arr.length+'</div>'+arr.map(cardHTML).join('');
  }
  h+=sec('Overdue',g.over);
  h+=sec('Due today',g.today);
  h+=sec('This week',g.week);
  h+=sec('Later',g.later);
  h+=sec('Completed',g.done);
  el('bd').innerHTML=h;
}

function cardHTML(t){
  var d=isDone(t)?{t:'DONE',c:'p-done'}:dueLabel(t.deadline);
  var h='<div class="card'+(isDone(t)?' done':'')+'" onclick="openTask(\''+t.id+'\')">'+
    '<div class="c-top"><div class="c-ttl">'+esc(t.title)+'</div>'+
    '<div class="pill '+d.c+'">'+d.t+'</div></div>';
  if(t.kind==='number'&&t.target){
    var got=shown(t), pc=Math.min(100,Math.round(got/Number(t.target)*100));
    h+='<div class="bar"><i class="'+(pc>=100?'full':'')+'" style="width:'+pc+'%"></i></div>'+
       '<div class="prog"><span>'+num(got)+' / '+num(t.target)+' '+esc(t.unit||'')+
       (t.scope==='shared'?' <span style="color:var(--dim)">(team)</span>':'')+'</span><span>'+pc+'%</span></div>';
  }else if(t.kind==='text'){
    h+='<div class="c-meta">Tap to write your answer</div>';
  }else{
    h+='<div class="c-meta">Tap to mark complete</div>';
  }
  return h+'</div>';
}

/* ---------- submit sheet ---------- */
var CUR=null, CHK=null;
function openTask(id){
  CUR=TASKS.filter(function(t){return t.id===id;})[0];
  if(!CUR)return;
  CHK=null;
  var m=mine(CUR.id);
  var h='<div class="grab"></div>';
  h+='<div style="font-size:16px;font-weight:700;line-height:1.35;margin-bottom:6px">'+esc(CUR.title)+'</div>';
  var d=dueLabel(CUR.deadline);
  h+='<div class="c-meta" style="margin-bottom:14px">Due '+(CUR.deadline||'no date')+' · '+d.t.toLowerCase()+'</div>';
  if(CUR.note)h+='<div class="msg" style="background:var(--s2);color:var(--txt2);border:1px solid var(--b2)">'+esc(CUR.note)+'</div>';
  h+='<div id="sm"></div>';
  if(CUR.kind==='number'){
    var got=shown(CUR);
    if(CUR.target){
      var pc=Math.min(100,Math.round(got/Number(CUR.target)*100));
      h+='<div class="bar"><i class="'+(pc>=100?'full':'')+'" style="width:'+pc+'%"></i></div>'+
         '<div class="prog" style="margin-bottom:16px"><span>'+num(got)+' / '+num(CUR.target)+' '+esc(CUR.unit||'')+
         (CUR.scope==='shared'?' (team total)':'')+'</span><span>'+pc+'%</span></div>';
    }
    h+='<div class="lbl">Add amount'+(CUR.unit?' ('+esc(CUR.unit)+')':'')+'</div>'+
       '<input class="inp" id="v" type="text" inputmode="decimal" placeholder="0">';
  }else if(CUR.kind==='text'){
    h+='<div class="lbl">Your answer</div>'+
       '<textarea class="inp" id="a" rows="4" style="resize:none;line-height:1.5" placeholder="Write your answer"></textarea>';
  }else{
    h+='<div class="lbl">Status</div><div class="tog">'+
       '<div id="tg-y" onclick="setChk(true)">Completed</div>'+
       '<div id="tg-n" onclick="setChk(false)">Not yet</div></div>';
  }
  h+=(CUR.kind==='text'?'':'<div class="lbl">Note (optional)</div><input class="inp" id="n" placeholder="Anything to add">')+
     '<button class="btn" id="sv" onclick="save()">SUBMIT</button>'+
     '<button class="btn btn2" style="margin-top:9px" onclick="closeSheet()">CANCEL</button>';
  if(m.length){
    h+='<div class="sec">Your entries</div>';
    h+=m.map(function(x){
      var v=CUR.kind==='number'?num(x.value)+' '+esc(CUR.unit||'')
            :CUR.kind==='text'?esc(x.note||''):(x.done?'Completed':'Not yet');
      var dt=new Date(x.created_at);
      return '<div class="hist"><b>'+v+'</b><span>'+dt.toLocaleString()+(x.note?' · '+esc(x.note):'')+'</span></div>';
    }).join('');
  }
  el('sheet-in').innerHTML=h;
  el('sheet').classList.add('on');
}
function setChk(v){
  CHK=v;
  el('tg-y').className=v?'on':'';
  el('tg-n').className=v?'':'on';
}
function closeSheet(){el('sheet').classList.remove('on');CUR=null;}

async function save(){
  if(!CUR)return;
  var nEl=el('n');
  var row={task_id:CUR.id,person_id:ME.id,note:nEl?((nEl.value||'').trim()||null):null};
  if(CUR.kind==='text'){
    var ans=(el('a').value||'').trim();
    if(!ans){el('sm').innerHTML='<div class="msg m-err">Write an answer before submitting.</div>';return;}
    row.note=ans;
  }else if(CUR.kind==='number'){
    var raw=(el('v').value||'').trim();
    var v=Number(raw);
    if(!raw||isNaN(v)){el('sm').innerHTML='<div class="msg m-err">Enter a valid number.</div>';return;}
    if(v<0){el('sm').innerHTML='<div class="msg m-err">Amount cannot be negative.</div>';return;}
    row.value=v;
  }else{
    if(CHK===null){el('sm').innerHTML='<div class="msg m-err">Choose completed or not yet.</div>';return;}
    row.done=CHK;
  }
  el('sv').disabled=true; el('sv').textContent='SENDING…';
  var r=await sb.from('submissions').insert(row);
  if(r.error){
    el('sm').innerHTML='<div class="msg m-err">Could not save: '+esc(r.error.message)+'</div>';
    el('sv').disabled=false; el('sv').textContent='SUBMIT';
    return;
  }
  closeSheet();
  await refresh();
}

if(!sb){loginView('No connection — check internet');}
else{sb.auth.getSession().then(function(s){ s.data.session?boot():loginView(); });}
</script>
